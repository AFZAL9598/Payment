<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Style UI</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-row">
        <button class="icon-button" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
        <a class="brand" href="#" aria-label="VideoHome">
          <span class="play-mark"></span>
          <strong>VideoHome</strong>
        </a>
      </div>

      <form class="search" role="search">
        <input type="search" placeholder="Search" aria-label="Search videos" />
        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m21 20-5.5-5.5m2-5.2a8.2 8.2 0 1 1-16.4 0 8.2 8.2 0 0 1 16.4 0Z" />
          </svg>
        </button>
      </form>

      <div class="actions">
        <button class="round-button" aria-label="Create">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button class="round-button" aria-label="Notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" />
          </svg>
        </button>
        <button class="avatar" aria-label="Account">A</button>
      </div>
    </header>

    <aside class="sidebar" aria-label="Primary">
      <a class="nav-item active" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z" /></svg>
        Home
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 6 4-6 4V5ZM3 6h8v6H3V6Zm0 9h18v3H3v-3Z" /></svg>
        Shorts
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM10 9l5 3-5 3V9Z" /></svg>
        Subscriptions
      </a>
      <hr />
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5" /></svg>
        Library
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5l4 2M21 12a9 9 0 1 1-9-9" /></svg>
        History
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z" /></svg>
        Your videos
      </a>
      <hr />
      <p class="sidebar-title">Subscriptions</p>
      <a class="channel-link" href="#"><span>TC</span>Tech Channel</a>
      <a class="channel-link" href="#"><span>MU</span>Music Up</a>
      <a class="channel-link" href="#"><span>FD</span>Food Daily</a>
    </aside>

    <main class="content">
      <nav class="chips" aria-label="Topics">
        <button class="chip active">All</button>
        <button class="chip">Music</button>
        <button class="chip">Gaming</button>
        <button class="chip">News</button>
        <button class="chip">Live</button>
        <button class="chip">JavaScript</button>
        <button class="chip">Comedy</button>
        <button class="chip">Cooking</button>
        <button class="chip">Watched</button>
        <button class="chip">New to you</button>
      </nav>

      <section class="video-grid" aria-label="Recommended videos" id="videoGrid"></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
